name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build output dir
        shell: bash
        run: echo "DIST_DIR=dist" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure Astro base/site for Pages
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          if [ -f "CNAME" ]; then
            DOMAIN="$(tr -d '\r\n' < "CNAME")"
            echo "ASTRO_SITE=https://${DOMAIN}" >> "$GITHUB_ENV"
            echo "ASTRO_BASE=/" >> "$GITHUB_ENV"
          else
            echo "ASTRO_SITE=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
            echo "ASTRO_BASE=/${REPO_NAME}/" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npm run build

      - name: Ensure Pages files (CNAME + .nojekyll)
        shell: bash
        run: |
          mkdir -p "${DIST_DIR}"
          touch "${DIST_DIR}/.nojekyll"
          if [ -f "CNAME" ]; then
            cp "CNAME" "${DIST_DIR}/CNAME"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

