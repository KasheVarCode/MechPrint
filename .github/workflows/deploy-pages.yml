name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Astro app directory
        shell: bash
        run: |
          # Поддерживаем два варианта структуры репозитория:
          # 1) Astro-проект в корне репо
          # 2) Astro-проект в подпапке MechPrintAstro/
          if [ -f "package.json" ] && [ -f "astro.config.mjs" ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          elif [ -f "MechPrintAstro/package.json" ] && [ -f "MechPrintAstro/astro.config.mjs" ]; then
            echo "APP_DIR=MechPrintAstro" >> "$GITHUB_ENV"
          else
            echo "Не найден Astro-проект (package.json + astro.config.mjs)." >&2
            echo "Ожидаю корень репо или папку MechPrintAstro/." >&2
            exit 1
          fi

          echo "DIST_DIR=${APP_DIR}/dist" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            MechPrintAstro/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Configure Astro base/site for Pages
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          if [ -f "${APP_DIR}/CNAME" ]; then
            DOMAIN="$(tr -d '\r\n' < "${APP_DIR}/CNAME")"
            echo "ASTRO_SITE=https://${DOMAIN}" >> "$GITHUB_ENV"
            echo "ASTRO_BASE=/" >> "$GITHUB_ENV"
          else
            echo "ASTRO_SITE=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
            echo "ASTRO_BASE=/${REPO_NAME}/" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Ensure Pages files (CNAME + .nojekyll)
        shell: bash
        run: |
          mkdir -p "${DIST_DIR}"
          touch "${DIST_DIR}/.nojekyll"
          if [ -f "${APP_DIR}/CNAME" ]; then
            cp "${APP_DIR}/CNAME" "${DIST_DIR}/CNAME"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

